name: Keep backend services warm

# Pings crm-backend and JuiceryCRM's public health checks every 10 minutes,
# but only during business hours (10:00-22:00 Asia/Dhaka = 04:00-16:00 UTC).
# This wakes both free-tier Render services each morning and keeps them from
# spinning down during the day, while letting them sleep overnight so the
# shared 750-hour/month free instance pool isn't exhausted.
on:
  schedule:
    - cron: '*/10 4-15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping crm-backend health check
        run: curl -fsS https://crm-backend-nyah.onrender.com/api/health || true

      - name: Ping JuiceryCRM health check
        run: curl -fsS https://crm.juicery.cafe/api/health || true
